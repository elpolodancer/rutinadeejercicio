<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Rutina</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- Pantalla principal -->
    <section id="vista-inicio" class="vista">
      <h1>Mi rutina</h1>
      <div class="menu">
        <button type="button" data-ir="calendario">Calendario</button>
        <button type="button" data-ir="ejercicios">Ejercicios</button>
      </div>
      <!-- Aviso temporal: app.js lo borra cuando carga bien -->
      <p class="estado" id="estado">La app no terminó de cargar. Recarga sin caché (Ctrl+Shift+R) y revisa que app.js esté junto a index.html.</p>
    </section>

    <!-- Calendario -->
    <section id="vista-calendario" class="vista" hidden>
      <header class="barra">
        <button type="button" class="volver" data-ir="inicio">Volver</button>
        <h2>Calendario</h2>
      </header>
      <div class="anio-nav">
        <button type="button" id="anio-ant" aria-label="Año anterior">&lsaquo;</button>
        <span id="anio" aria-live="polite"></span>
        <button type="button" id="anio-sig" aria-label="Año siguiente">&rsaquo;</button>
      </div>
      <button type="button" id="btn-hoy" class="hoy">Ir al año actual</button>
      <div class="meses" id="meses"></div>
    </section>

    <!-- Ejercicios -->
    <section id="vista-ejercicios" class="vista" hidden>
      <header class="barra">
        <button type="button" class="volver" data-ir="inicio">Volver</button>
        <h2>Ejercicios</h2>
      </header>
      <p class="actual" id="actual" aria-live="polite">Elige un ejercicio para empezar.</p>
      <div class="botones" id="botones"></div>
    </section>
  </main>
  <script>
    /* Aviso temporal: muestra en pantalla cualquier error de carga o de JavaScript */
    window.addEventListener("error", function (e) {
      var p = document.getElementById("estado");
      if (!p) return;
      if (e.target && e.target.src) {
        p.textContent = "No se pudo cargar " + e.target.src.split("/").pop() + ". Revisa que esté en la misma carpeta que index.html.";
      } else {
        p.textContent = "Error de JavaScript: " + e.message + " (" + String(e.filename).split("/").pop() + ", línea " + e.lineno + ")";
      }
    }, true);
  </script>
  <script src="app.js" defer></script>
</body>
</html>
